[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quakeflow"
version = "1.0.0"
description = "A production-style earthquake data pipeline and analytics lakehouse."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Kendrick Lin", email = "kdlin@calpoly.edu" }]
dependencies = [
  "duckdb>=1.4.0,<2.0",
  "pytz>=2025.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
quakeflow = "quakeflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/quakeflow/dashboard.py" = ["E501"]
